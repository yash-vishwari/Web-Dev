<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
      
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    
    <div class="card">

        <div class="search">
            <input type="text" placeholder="enter city name" id ="city_input" spellcheck="false">
            <button id="searchButton"><img src="images/search.png" alt=""></button>

        </div>

        <div class="weather">


            <img src="images/rain.png" class="weather-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">Bhopal</h2>
        
            <div class="details-box">
                    <div class="details">
                <div class="col">

                    <img src="images/humidity.png" alt="">
                   <div  class="text-info">
                     <p class="humidity">100 <span>%</span></p>
                    <p>Humidity</p>
                   </div>
                </div>

                <div class="col">

                     <img src="images/wind.png" alt="">
                     <div class="text-info">
                         <p class="wind">22 km/hr</p>
                         <p>Wind Speed</p>
                     </div>
                </div>


            </div>
            </div>
        </div>
        
    </div>



    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
</body>
</html>
