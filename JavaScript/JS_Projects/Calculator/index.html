<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="main vh-100 vw-100 d-flex justify-content-center align-items-center">

        <div class="bg-light CalcOuter">


           <div class="CalcDisplay fs-1 px-3 text-end" >

            <label for="result" id="result">0</label>
           </div>


           

           <div class="CalcKeyBoard">

            <button class="CalcButton" value="AC" onclick="Calculate('AC')">AC</button>
            <button class="CalcButton" value="C" onclick="Calculate('C')">C</button>
            <button class="CalcButton" value="%" onclick="Calculate('%')">%</button>
            <button class="CalcButton" value="/" onclick="Calculate('/')">/</button>
            <button class="CalcButton" value="7" onclick="Calculate('7')">7</button>
            <button class="CalcButton" value="8" onclick="Calculate('8')">8</button>
            <button class="CalcButton" value="9" onclick="Calculate('9')">9</button>
            <button class="CalcButton" value="*" onclick="Calculate('*')">*</button>
            <button class="CalcButton" value="4" onclick="Calculate('4')">4</button>
            <button class="CalcButton" value="5" onclick="Calculate('5')">5</button>
            <button class="CalcButton" value="6" onclick="Calculate('6')">6</button>
            <button class="CalcButton" value="-" onclick="Calculate('-')">-</button>
            <button class="CalcButton" value="1" onclick="Calculate('1')">1</button>
            <button class="CalcButton" value="2" onclick="Calculate('2')">2</button>
            <button class="CalcButton" value="3" onclick="Calculate('3')">3</button>
            <button class="CalcButton" value="+" onclick="Calculate('+')">+</button>
            <button class="CalcButton" value="0" onclick="Calculate('0')">0</button>
            <button class="CalcButton" value="." onclick="Calculate('.')">.</button>
            <button  id="EqualButton" value="=" onclick="Calculate('=')">=</button>

           </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
