<body class="bg-dark">
    

    <header class="bg-primary text-light p-3 text-center d-flex justify-content-between">

      </div >

    <main>

        <div class="mx-auto mt-3 p-4">

            <form class="d-flex flex-column gap-3 rounded justify-content-center align-items-center" id="passForm">



                <input type="text" placeholder="Enter WebSite Name" class="w-25 rounded" id="siteName">

                <input type="text" placeholder="Enter User Name" class="w-25 rounded" id="userName">


                <input type="text" placeholder="Enter Password Name" class="w-25 rounded" id="password">



                <div class="mx-auto mt-3 p-4 ">
                     <button type ="button"    onclick="clearButton()"  class="btn btn-outline-danger">Clear</button>
                    <button  type ="button" onclick="SaveButton()"   class="btn btn-outline-primary me-3">Save</button>
                   
                </div>

                
            </form>
