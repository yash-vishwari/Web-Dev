<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
   
   
    
</head>
<body>
    
    <div class="outerMostBox">


        <div class="outerBox">


        <div class="container">


            <div class="heading">
                <h1>Coaching Institute Registration Form</h1>
            </div>

        <div>
        <input type="text"  id= "name" placeholder="Enter your Full Name" class="inputField" required>
    </div>

    <div>
        <input type="email" id ="email" placeholder="Enter your Email" class="inputField" required>
    </div>

    <div>
        <input type="number" placeholder="Enter your Mobile Number" class="inputField" required>
    </div>

    <div>
        <input type="date" placeholder="dd/mm/yyyy" class="inputField" required>
    </div>


    <div class="TwoBoxOneBlock">
        <select>
            <option value="">Last Completed Qualification</option>
            <option value="10th Class">10th Class</option>
            <option value="12th Class">12th Class</option>
            <option value="Graduate">Graduate</option>
            <option value="Postgraduate">Postgraduate</option>
        </select>

        <input type="text" name="" id="" placeholder="Percentage(0-100)/Grade(A-F) in Last Qualification " required>
    </div>

    <div class="TwoBoxOneBlock">

        <select>
            <option value="">Preferred Course</option>
            <option value="IIT-JEE">IIT-JEE</option>
            <option value="NEET">NEET</option>
            <option value="Banking Exams">Banking Exams</option>
            <option value="UPSC">UPSC</option>
        </select>

        <select>
            <option value="">Batch Timing Preference</option>
            <option value="Morning">Morning</option>
            <option value="Afternoon">Afternoon</option>
            <option value="Evening">Evening/option>
            <option value="Weekend">Weekend</option>
        </select>
    </div>



        
        <div>
        <input type="text" placeholder="Enter Residential Address" class="inputField" required>
        </div>

        <div class="TwoBoxOneBlock">
        <input type="text" placeholder="Enter your City" required>
        <input type="number" placeholder="Enter City pin code" required>
        </div>
 


    <div class="TwoBoxOneBlock">

        <input type="text" placeholder="Guardian’s Full Name" required>
        <input type="number" placeholder="Guardian’s Contact Number" required>

    </div>

    <div>
       <select class="inputField">
            <option value=""> How did you hear about us?</option>
            <option value="Friends">Friends</option>
            <option value="Online">Online</option>
            <option value="Newspaper">Newspaper/option>
            <option value=" Social Media "> Social Media</option>
            <option value="Other">Other</option>
        </select>
    </div>
    
    
    <button class="btn btn-primary">Sumbit</button>
</div>

    </div>
    
    </div>


    
    
    
    

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
</body>
</html>
