<body>
    
    <div id ="outerdiv">





        <div id ="Loginbox">

            <form id ="LoginForm">
            
            <div id="Login">
           <h2 class="Heading"><span>Lo</span>gin</h2>
            </div >

            <div class="Email_input">
            <span><i class="bi bi-envelope"></i></span>
             <input type="email" placeholder="Enter your email" class="input-tag" required>

            </div>


            <div class="Password_input">

                <span><i class="bi bi-lock"></i></span>

            </div>

            <div id="forgot_password">

                <input type="checkbox" id="remember">
                <label for="remember">Remember me </label>
                <a href="#">Forgot password?</a>
            </div>


            <button class ="button" type="submit">Login Now</button>
            <p class="bottom-text">Don't have an account? <a href="#">Signup now</a></p>
            </form>
            

        </div>
        




        <div id="RegistrationBox">

            <div>
                <form id ="RegistrationForm">

                <div id="Registration">
                <h2 class="Heading"><span>Re</span>gistration</h2>
                </div >

                <div>

                    <span><i class="bi bi-person"></i></span>
                    <input type="text" placeholder="Enter your name" class="input-tag">
                </div>
                
                <div class="Email_input">
                    <span><i class="bi bi-envelope"></i></span>

                </div>

                <div class="Password_input">

                 <div>

                <label for="">I accept all terms and conditions</label>
               
                </div>

                </form>
