    <main>

        <p>
        <b>Description </b>
        :This task involves creating a Doctor Appointment Form layout using only HTML, based on a given design..
        
         
    </p>
    <hr>
    <table width="900" cellpadding="10">
    <tr>

       
        <td >
            <img src="./img2.png" alt="Doctor Image" >
        </td>

        
        <td width="60%">

            <h2>Doctor Appointment Form</h2>
            <hr>

            <form>

                
                <label>Appointment Date</label><br>
                <input type="date"><br><br>

                
                <label>Appointment Time</label><br>
                <input type="time"><br><br>

                
                <label>Name</label><br>
                <input type="text" placeholder="First">
                <input type="text" placeholder="Last"><br><br>

                
                <label>Gender</label><br>
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female<br><br>

                
                <label>Phone</label><br>
                <input type="text"><br><br>

               
                <label>Address</label><br>
                <input type="text" placeholder="City">
                <input type="text" placeholder="State"><br><br>

            
                <label>Your Query</label><br>
                <textarea rows="4" cols="30"></textarea><br><br>

                
                <label>Appointment Type</label><br>
                <p>Select which appointment type(s) you require</p>

                <input type="checkbox"> Cervix checkup<br>
                <input type="checkbox"> Heart checkup<br>
                <input type="checkbox"> Eye check-up<br>
                <input type="checkbox"> Hearing Test<br><br>

                
                <input type="submit" value="Send">

            </form>

        </td>

    </tr>
</table>
