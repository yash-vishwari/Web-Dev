    <main>

        <p>
        <b>Description </b>
        :This task requires creating a Farewell Party Survey Form using only pure HTML.
    </p>
    <fieldset>

<h3>Farewell Party Survey Form</h3>

    <form>

    
    <label>Name</label>
    <input type="text" name="name" placeholder="Enter your name"><br><br>

    
    <label>Email</label>
    <input type="email" name="email" placeholder="Enter your email"><br><br>

    
    <label>Age</label>
    <input type="number" name="age" placeholder="Enter your age"><br><br>

    
    <label>Which option best describes you?</label>
    <select name="role">
        <option>Student</option>
        <option>Teacher</option>
        <option>Guest</option>
        <option>Other</option>
    </select><br><br>

    
    <label>Will you attend the party?</label>
    <input type="radio" name="attend" value="yes"> Yes
    <input type="radio" name="attend" value="no"> No<br><br>

    
    <label>What did you like about the program?</label><br>
    <input type="checkbox" name="like" value="training"> Training<br>
    <input type="checkbox" name="like" value="sessions"> The Learning Sessions from Industry Experts<br>
    <input type="checkbox" name="like" value="meetups"> Community Meetups<br>
    <input type="checkbox" name="like" value="brown"> Brown Bag Sessions<br>
    <input type="checkbox" name="like" value="hybrid"> Switching to Hybrid Mode<br>
    <input type="checkbox" name="like" value="food"> Food, Office etc.<br><br>

    
    <label>Any comments or suggestions</label><br>
    <textarea rows="4" cols="40"></textarea><br><br>

    
    <input type="reset" value="Reset">
    <input type="submit" value="Submit">

</form>
   

    </fieldset>
