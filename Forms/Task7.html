        <p>
        <b>Description </b>
        :This task involves creating a User Input Form using only pure HTML a User Input Form using only pure HTML.
    </p>
    <form>

    
    <fieldset>
        <legend>Personal Particular</legend>

        <label>Name:</label>
        <input type="text" name="name"><br><br>

        <label>Password:</label>
        <input type="password" name="password"><br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female<br><br>

        <label>Age:</label>
        <select name="age">
            <option>&lt; 1 year old</option>
            <option>1-5 years</option>
            <option>6-10 years</option>
            <option>11-18 years</option>
            <option>18+ years</option>
        </select>

    </fieldset>

    <br>

    
    <fieldset>
        <legend>Languages</legend>

        <input type="checkbox" name="lang" value="java"> Java
        <input type="checkbox" name="lang" value="c"> C/C++
        <input type="checkbox" name="lang" value="csharp"> C#

    </fieldset>

    <br>

    
    <fieldset>
        <legend>Instruction</legend>

        <textarea rows="5" cols="40" placeholder="Enter your instruction here..."></textarea>

    </fieldset>

    <br>

    
    <input type="submit" value="SEND">
    <input type="reset" value="CLEAR">

</form>
