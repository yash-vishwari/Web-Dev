    <main>

        <p>
        <b>Description </b>
        :This task involves designing a structured HTML form to collect personal details from a user.
        <br>
         The form includes multiple input fields such as first name, last name email address. 
       
    </p>
    <hr>
    <form>
        <label for="Firstname">Firstname:</label>
       
        <input type="text" id="Firstname">
        
        <br>
        <br>
        <label for="Lastname">Lastname:</label>
       
        <input type="text" id="Lastname">

        <br>
        <br>
        <label for="email">Email :</label>
        <input type="enail" id ="email">
        <br>
        <br>

        <label for="password">Password:</label>
        <input type="password" id ="password">

        <br>
        <br>
        Gender:
        <br>
        <label for="Male">Male</label>
        <input type="radio" id ="Male" name="gender">
        <br>
        <label for="Female">Female</label>
        <input type="radio" id ="Female" name="gender">
        <br>
        <label for="Other">Other</label>
        <input type="radio" id ="Other" name="gender">
        
        <br>
        <br>

        
        <label for="age">Age :</label>
        <input type="number" id ="age">

        <br>
        <br>
        Preferences:
        <br>
        
        <label for="Acrylic Painting">Acrylic Painting</label>
        <input type="checkbox" id ="Acrylic Painting" name="Painting">
        <br>
        <label for="Oil Painting">Oil Painting</label>
        <input type="checkbox" id ="Oil Painting" name="Painting">
        <br>
        
        <label for="Water Color Painting">Water Color Painting</label>
        <input type="checkbox" id ="Water Color Painting" name="Painting">
        <br>
 
        <br>

        <label for="occupation">Select Occupation</label>
        <select name="" id="occupation">

            <option value="Student">Student</option>
            <option value="Other">Other</option>
        </select>

        <br>
        <br>
        <label for="Bio">Bio</label>
        <textarea name="" id="Bio" placeholder ="Share few lines about yourself..."></textarea>

        <br>
        <br>
        <button type ="reset">
            RESET
        </button>
        <button type ="submit">
            SUBMIT
        </button>
    </form>
